<div class="flex justify-content-center align-items-center">
  <p-button
    icon="pi pi-arrow-left"
    [rounded]="true"
    (onClick)="previousYear()"
    [text]="true"
    class="mr-2" />
  <p class="text-primary text-3xl">{{$currentYear()}}</p>
  <p-button
    icon="pi pi-arrow-right"
    [rounded]="true"
    (onClick)="nextYear()"
    class="ml-2"
    [text]="true" />
</div>

<div class="text-center">
  <form [formGroup]="form">
    <p-multiSelect
      [options]="setupsAvailable"
      placeholder="Filtrer par setup"
      optionValue="id"
      optionLabel="name"
      [filter]="true"
      [selectedItemsLabel]="$selectedLabel()"
      [maxSelectedLabels]="3"
      [showHeader]="true"
      formControlName="setup"
      appendTo="body"
      [style]="{'width':'20rem'}"
      (onChange)="onChangeFilters()"
      [showClear]="true"
      (onClear)="onClearSetup()">
    </p-multiSelect>
    <p-multiSelect
      [options]="ammunitionAvailable"
      placeholder="Filtrer par munitions"
      optionValue="id"
      optionLabel="name"
      [filter]="false"
      [showToggleAll]="true"
      [selectedItemsLabel]="$selectedLabel()"
      [maxSelectedLabels]="3"
      [showHeader]="true"
      formControlName="ammo"
      appendTo="body"
      [style]="{'width':'20rem'}"
      (onChange)="onChangeFilters()"
      (onClear)="onClearAmmo()"
      [showClear]="true">
    </p-multiSelect>
    <p-multiSelect
      [options]="distanceAvailable"
      placeholder="Filtrer par distance"
      [filter]="false"
      [showToggleAll]="true"
      [selectedItemsLabel]="$selectedLabel()"
      [maxSelectedLabels]="3"
      [showHeader]="true"
      appendTo="body"
      [style]="{'width':'20rem'}"
      [showClear]="true"
      optionLabel="name"
      formControlName="distance"
      optionValue="value"
      (onClear)="onClearDistance()"
      (onChange)="onChangeFilters()">
    </p-multiSelect>
    <p-multiSelect
      [options]="months"
      placeholder="Filtrer par mois"
      [filter]="false"
      [showToggleAll]="true"
      [selectedItemsLabel]="$selectedLabel()"
      [maxSelectedLabels]="3"
      [showHeader]="true"
      appendTo="body"
      formControlName="month"
      [style]="{'width':'20rem'}"
      [showClear]="true"
      (onClear)="onClearMonths()"
      (onChange)="onChangeMonth()">
    </p-multiSelect>
  </form>
</div>
<div class="text-center mt-4">
  <p-button label="Effacer tous les filtres" severity="secondary" />
</div>

@if (!isLoading){
<div class="">
  <p>
    Total de séances cette année :
    <span class="text-primary">{{$totalTrainingSessionInCurrentYear()}}</span>
  </p>
</div>
@if ($totalTrainingSessionInCurrentYear() === 0){
<p class="text-2xl text-center text-red-500">
  Aucune session enregistrée en {{$currentYear()}}
</p>
} @else {
<p-chart type="bar" [data]="data" [options]="options"></p-chart>
} }
